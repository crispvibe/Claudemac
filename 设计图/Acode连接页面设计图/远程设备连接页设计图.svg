<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1040" viewBox="0 0 980 1040">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.52" stop-color="#fbfbfa"/>
      <stop offset="1" stop-color="#f1f2ef"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.07"/>
    </filter>
    <style>
      .screen { fill: url(#bg); }
      .card { fill: rgba(255,255,255,0.78); stroke: rgba(0,0,0,0.06); stroke-width: 1; filter: url(#softShadow); }
      .soft { fill: rgba(255,255,255,0.64); stroke: rgba(0,0,0,0.055); stroke-width: 1; }
      .ink { fill: #141414; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", Arial, sans-serif; }
      .muted { fill: #737373; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", Arial, sans-serif; }
      .light { fill: #a8a8a8; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", Arial, sans-serif; }
      .title { font-size: 22px; font-weight: 700; }
      .h1 { font-size: 26px; font-weight: 760; }
      .h2 { font-size: 15px; font-weight: 700; }
      .body { font-size: 13px; font-weight: 500; }
      .caption { font-size: 11px; font-weight: 500; }
      .pillText { font-size: 12px; font-weight: 700; }
      .line { stroke: rgba(0,0,0,0.08); stroke-width: 1; }
      .deviceIcon { fill: none; stroke: #151515; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="980" height="1040" fill="#f6f6f4"/>
  <text x="54" y="58" class="ink h1">远程设备连接页设计图</text>
  <text x="54" y="84" class="muted body">同一个设置子页内完成“我的设备”和“设备码”两种连接方式，不再打开独立“我的设备”页面。</text>

  <g transform="translate(54,120)">
    <rect width="390" height="844" rx="42" class="screen" filter="url(#shadow)"/>
    <rect x="104" y="18" width="182" height="34" rx="17" fill="#050505"/>
    <text x="37" y="39" class="ink body" font-weight="800">9:41</text>
    <text x="311" y="39" class="ink caption">● ● ●</text>
    <text x="337" y="39" class="ink caption">Wi-Fi</text>

    <g transform="translate(20,78)">
      <circle cx="20" cy="20" r="20" fill="rgba(255,255,255,0.74)" stroke="rgba(0,0,0,0.04)"/>
      <path d="M24 11 L15 20 L24 29" fill="none" stroke="#2f3033" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="154" y="27" text-anchor="middle" class="ink title">远程设备</text>
      <rect x="258" y="3" width="84" height="34" rx="17" fill="rgba(255,255,255,0.7)" stroke="rgba(0,0,0,0.06)"/>
      <circle cx="276" cy="20" r="4" fill="#5fc167"/>
      <text x="292" y="24" class="muted caption">已登录</text>
    </g>

    <g transform="translate(26,146)">
      <text x="0" y="26" class="ink h1">选择电脑</text>
      <text x="0" y="50" class="muted body">连接已登录账号的远程设备，或输入设备码。</text>
    </g>

    <g transform="translate(26,218)">
      <rect width="338" height="48" rx="24" fill="rgba(255,255,255,0.62)" stroke="rgba(0,0,0,0.055)"/>
      <rect x="5" y="5" width="164" height="38" rx="19" fill="#141414"/>
      <text x="87" y="30" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', Arial" font-size="13" font-weight="700">我的设备</text>
      <text x="252" y="30" text-anchor="middle" class="muted pillText">设备码</text>
    </g>

    <g transform="translate(26,292)">
      <rect width="338" height="284" rx="28" class="card"/>
      <text x="20" y="34" class="ink h2">我的设备</text>
      <text x="20" y="54" class="muted caption">来自当前账号的电脑</text>
      <rect x="253" y="18" width="64" height="30" rx="15" class="soft"/>
      <text x="285" y="38" text-anchor="middle" class="ink caption" font-weight="700">刷新</text>

      <g transform="translate(18,80)">
        <rect width="302" height="58" rx="18" fill="rgba(255,255,255,0.62)" stroke="rgba(0,0,0,0.045)"/>
        <rect x="12" y="12" width="34" height="34" rx="12" fill="#f1f1ef"/>
        <path d="M21 25 h16 v11 h-16 z M26 39 h6 M24 22 h10" class="deviceIcon"/>
        <text x="58" y="25" class="ink body" font-weight="700">Oreo 的 MacBook Pro</text>
        <text x="58" y="44" class="muted caption">macOS · 在线 · 局域网</text>
        <rect x="238" y="15" width="48" height="28" rx="14" fill="#141414"/>
        <text x="262" y="34" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', Arial" font-size="11" font-weight="700">连接</text>
      </g>

      <g transform="translate(18,148)">
        <rect width="302" height="58" rx="18" fill="rgba(255,255,255,0.62)" stroke="rgba(0,0,0,0.045)"/>
        <rect x="12" y="12" width="34" height="34" rx="12" fill="#f1f1ef"/>
        <path d="M20 24 h18 v12 h-18 z M25 39 h8 M28 36 v3" class="deviceIcon"/>
        <text x="58" y="25" class="ink body" font-weight="700">Windows Workstation</text>
        <text x="58" y="44" class="muted caption">windows · 在线 · 需确认</text>
        <rect x="238" y="15" width="48" height="28" rx="14" fill="#141414"/>
        <text x="262" y="34" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', Arial" font-size="11" font-weight="700">连接</text>
      </g>

      <g transform="translate(18,216)">
        <rect width="302" height="48" rx="18" fill="rgba(255,255,255,0.36)" stroke="rgba(0,0,0,0.035)"/>
        <rect x="12" y="9" width="30" height="30" rx="11" fill="#eeeeec"/>
        <path d="M20 21 h14 v9 h-14 z M24 33 h6" class="deviceIcon" opacity="0.35"/>
        <text x="54" y="21" class="light caption" font-weight="700">Studio Mini</text>
        <text x="54" y="38" class="light caption">离线 · 2 小时前</text>
      </g>
    </g>

    <g transform="translate(26,604)">
      <rect width="338" height="96" rx="28" class="card"/>
      <rect x="18" y="22" width="42" height="42" rx="17" fill="#f1f1ef"/>
      <text x="39" y="50" text-anchor="middle" class="ink h2">#</text>
      <text x="74" y="35" class="ink h2">输入设备码</text>
      <text x="74" y="56" class="muted caption">用电脑端显示的固定设备码连接</text>
      <path d="M303 38 L312 47 L303 56" fill="none" stroke="#8a8a8a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="196" y="784" text-anchor="middle" class="light caption">左图：默认我的设备状态</text>
  </g>

  <g transform="translate(536,120)">
    <rect width="390" height="844" rx="42" class="screen" filter="url(#shadow)"/>
    <rect x="104" y="18" width="182" height="34" rx="17" fill="#050505"/>
    <text x="37" y="39" class="ink body" font-weight="800">9:41</text>
    <text x="311" y="39" class="ink caption">● ● ●</text>
    <text x="337" y="39" class="ink caption">Wi-Fi</text>

    <g transform="translate(20,78)">
      <circle cx="20" cy="20" r="20" fill="rgba(255,255,255,0.74)" stroke="rgba(0,0,0,0.04)"/>
      <path d="M24 11 L15 20 L24 29" fill="none" stroke="#2f3033" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="154" y="27" text-anchor="middle" class="ink title">远程设备</text>
      <rect x="258" y="3" width="84" height="34" rx="17" fill="rgba(255,255,255,0.7)" stroke="rgba(0,0,0,0.06)"/>
      <circle cx="276" cy="20" r="4" fill="#5fc167"/>
      <text x="292" y="24" class="muted caption">已登录</text>
    </g>

    <g transform="translate(26,146)">
      <text x="0" y="26" class="ink h1">输入设备码</text>
      <text x="0" y="50" class="muted body">设备码在电脑端远程账号卡片中查看。</text>
    </g>

    <g transform="translate(26,218)">
      <rect width="338" height="48" rx="24" fill="rgba(255,255,255,0.62)" stroke="rgba(0,0,0,0.055)"/>
      <text x="87" y="30" text-anchor="middle" class="muted pillText">我的设备</text>
      <rect x="169" y="5" width="164" height="38" rx="19" fill="#141414"/>
      <text x="252" y="30" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', Arial" font-size="13" font-weight="700">设备码</text>
    </g>

    <g transform="translate(26,292)">
      <rect width="338" height="252" rx="30" class="card"/>
      <text x="22" y="38" class="ink h2">固定设备码</text>
      <text x="22" y="60" class="muted caption">支持 Mac / Windows / 其他桌面设备</text>

      <g transform="translate(20,86)">
        <rect width="298" height="54" rx="20" fill="rgba(255,255,255,0.72)" stroke="rgba(0,0,0,0.055)"/>
        <text x="20" y="34" class="light body">ABCD-EFGH-12</text>
        <path d="M256 21 h16 v16 h-16 z M249 14 h16 v16 h-16 z" fill="none" stroke="#6d6d6d" stroke-width="1.8" stroke-linejoin="round"/>
      </g>

      <rect x="20" y="158" width="142" height="44" rx="22" fill="rgba(255,255,255,0.62)" stroke="rgba(0,0,0,0.055)"/>
      <text x="91" y="186" text-anchor="middle" class="ink body" font-weight="700">查找设备</text>
      <rect x="176" y="158" width="142" height="44" rx="22" fill="#141414"/>
      <text x="247" y="186" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', Arial" font-size="13" font-weight="700">连接</text>

      <text x="22" y="226" class="muted caption">解析成功后显示设备名称和确认状态。</text>
    </g>

    <g transform="translate(26,570)">
      <rect width="338" height="126" rx="28" class="card"/>
      <rect x="20" y="23" width="42" height="42" rx="17" fill="#f1f1ef"/>
      <path d="M31 36 h20 v14 h-20 z M36 53 h10 M34 33 h14" class="deviceIcon"/>
      <text x="76" y="38" class="ink h2">Oreo 的 MacBook Pro</text>
      <text x="76" y="60" class="muted caption">macOS · 需要电脑端确认</text>
      <line x1="20" y1="80" x2="318" y2="80" class="line"/>
      <text x="20" y="106" class="muted caption">等待确认时保留在本页，不跳转、不遮挡主聊天页。</text>
    </g>

    <g transform="translate(26,724)">
      <rect width="338" height="56" rx="28" fill="rgba(20,20,20,0.92)"/>
      <text x="169" y="36" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', Arial" font-size="15" font-weight="760">连接这台电脑</text>
    </g>

    <text x="196" y="784" text-anchor="middle" class="light caption">右图：设备码状态</text>
  </g>

  <g transform="translate(54,994)">
    <text x="0" y="0" class="muted caption">设计原则：删除独立“我的设备”页；设置内标题改为“远程设备”；不出现 Mac 专属命名；保留两个简单模式；无高级连接、IP、端口、Token。</text>
  </g>
</svg>
